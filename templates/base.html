<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FaceID Biometric Security System{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            900: '#0c4a6e',
                        },
                        cyber: {
                            green: '#10b981',
                            cyan: '#06b6d4',
                            blue: '#3b82f6',
                            purple: '#8b5cf6',
                            red: '#ef4444'
                        }
                    },
                    fontFamily: {
                        mono: ['JetBrains Mono', 'Menlo', 'monospace'],
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom Style -->
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body class="h-full flex flex-col font-sans bg-slate-950 text-slate-100 antialiased selection:bg-brand-500 selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <!-- Brand / Logo -->
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/20 ring-1 ring-white/20">
                    <i class="fa-solid fa-fingerprint text-white text-lg"></i>
                </div>
                <div>
                    <a href="/" class="flex items-center space-x-2">
                        <span class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent">FaceID<span class="text-cyan-400">.AI</span></span>
                        <span class="text-[10px] font-mono tracking-widest px-2 py-0.5 rounded-full bg-cyan-950/80 border border-cyan-800/80 text-cyan-300 font-semibold uppercase">PRO</span>
                    </a>
                </div>
            </div>

            <!-- Central Live Clock & System Pill -->
            <div class="hidden md:flex items-center space-x-4">
                <div class="flex items-center space-x-2 px-3 py-1 rounded-full bg-slate-800/70 border border-slate-700/60 text-xs font-mono text-slate-300">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    <span class="text-emerald-400 font-bold">SYSTEM ACTIVE</span>
                    <span class="text-slate-600">•</span>
                    <span id="nav-live-clock">--:--:--</span>
                </div>
            </div>

            <!-- Right Navigation Actions -->
            <nav class="flex items-center space-x-2 sm:space-x-3">
                <a href="/" class="flex items-center space-x-2 px-3 py-2 rounded-lg text-sm font-medium transition-colors text-slate-300 hover:text-white hover:bg-slate-800/80 {% if request.url.path == '/' or request.url.path == '/scan' %}bg-slate-800 text-cyan-400 border border-cyan-500/30{% endif %}">
                    <i class="fa-solid fa-camera-viewfinder"></i>
                    <span class="hidden sm:inline">Face Scanner</span>
                </a>

                <a href="/admin" class="flex items-center space-x-2 px-3 py-2 rounded-lg text-sm font-medium transition-colors text-slate-300 hover:text-white hover:bg-slate-800/80 {% if request.url.path == '/admin' %}bg-slate-800 text-cyan-400 border border-cyan-500/30{% endif %}">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span class="hidden sm:inline">Admin Portal</span>
                </a>

                <a href="/admin/logs" class="flex items-center space-x-2 px-3 py-2 rounded-lg text-sm font-medium transition-colors text-slate-300 hover:text-white hover:bg-slate-800/80 {% if request.url.path == '/admin/logs' %}bg-slate-800 text-cyan-400 border border-cyan-500/30{% endif %}">
                    <i class="fa-solid fa-list-check"></i>
                    <span class="hidden sm:inline">Scan Logs</span>
                </a>

                <div id="auth-actions-container" class="pl-2 border-l border-slate-800">
                    <!-- Populated by JS based on login cookie -->
                    <a href="/admin/login" id="nav-login-btn" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-cyan-600 hover:bg-cyan-500 text-white transition-all shadow-md shadow-cyan-600/20">
                        Admin Login
                    </a>
                </div>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 bg-slate-950/80 py-4 text-center text-xs text-slate-500 font-mono">
        <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
            <div>
                &copy; 2026 <span class="text-slate-300 font-semibold">Saitharun Cherukuri</span>. All rights reserved.
            </div>
            <div class="text-slate-400">
                FaceID Engine v2.0 • Developed by <span class="text-cyan-400 font-semibold">Saitharun Cherukuri</span>
            </div>
        </div>
    </footer>

    <!-- Audio synthesizer -->
    <script src="/static/js/sounds.js"></script>

    <!-- Live clock & Auth state helper -->
    <script>
        function updateClock() {
            const clockEl = document.getElementById('nav-live-clock');
            if (clockEl) {
                const now = new Date();
                clockEl.textContent = now.toLocaleTimeString();
            }
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Check if admin cookie exists
        function checkAdminCookie() {
            const hasAuth = document.cookie.includes('faceid_token=');
            const authContainer = document.getElementById('auth-actions-container');
            if (authContainer) {
                if (hasAuth) {
                    authContainer.innerHTML = `
                        <a href="/admin/logout" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold text-rose-300 hover:text-white hover:bg-rose-950/60 border border-rose-900/60 transition-all">
                            <i class="fa-solid fa-arrow-right-from-bracket mr-1"></i>Logout
                        </a>
                    `;
                } else {
                    authContainer.innerHTML = `
                        <a href="/admin/login" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-cyan-600 hover:bg-cyan-500 text-white transition-all shadow-md shadow-cyan-600/20">
                            Admin Login
                        </a>
                    `;
                }
            }
        }
        checkAdminCookie();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
